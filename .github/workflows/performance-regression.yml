name: Performance regression test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA to compare against
        required: true
        type: string

permissions:
  contents: read

jobs:
  performance-regression:
    name: performance-regression
    runs-on: macos-26
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out base revision
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          path: base
          fetch-depth: 0

      - name: Check out candidate revision
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0

      - name: Verify checked-out revisions
        run: |
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('candidate/Package.swift', 'candidate/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Overlay identical benchmark harness and fixtures on base
        run: |
          for file in \
            Features/Editor/EditorEditingPerformanceTests.swift \
            Features/Editor/SyntaxHighlighting/JavaHighlightingPerformanceTests.swift \
            Support/PerformanceBenchmark.swift \
            Features/Editor/SyntaxHighlighting/SyntaxHighlightingPerformanceTests.swift; do
            mkdir -p "base/Tests/vminiTests/$(dirname "$file")"
            rm -f "base/Tests/vminiTests/$(basename "$file")"
            cp "candidate/Tests/vminiTests/$file" "base/Tests/vminiTests/$file"
          done
          rsync -a --delete candidate/Tests/vminiTests/PerformanceCorpus/ base/Tests/vminiTests/PerformanceCorpus/
          cp candidate/scripts/benchmark-performance.sh base/scripts/
          cp candidate/scripts/compare_performance.py base/scripts/
          cp candidate/scripts/performance-budgets.json base/scripts/

      - name: Test the performance comparator
        run: python3 -m unittest discover -s candidate/scripts -p 'test_compare_performance.py' -v

      - name: Build both Release test bundles before timing
        shell: bash
        run: |
          mkdir -p performance-results
          (cd base && ./scripts/benchmark-performance.sh --build-only) 2>&1 | tee performance-results/base-build.log
          (cd candidate && ./scripts/benchmark-performance.sh --build-only) 2>&1 | tee performance-results/candidate-build.log

      - name: Measure base and candidate in alternating order
        id: benchmarks
        run: |
          mkdir -p performance-results
          failed=0
          for batch in 1 2 3; do
            if (( batch % 2 )); then first=base; second=candidate; else first=candidate; second=base; fi
            for side in "$first" "$second"; do
              output="$GITHUB_WORKSPACE/performance-results/$side-$batch.json"
              if (cd "$side" && ./scripts/benchmark-performance.sh --skip-build --cold-samples 5 --output "$output"); then
                :
              else
                failed=1
              fi
            done
          done
          exit "$failed"

      - name: Compare reports and write the job summary
        if: always()
        run: |
          set +e
          python3 candidate/scripts/compare_performance.py compare \
            --budgets candidate/scripts/performance-budgets.json \
            --summary performance-results/summary.md \
            --report performance-results/comparison.json \
            --base performance-results/base-1.json \
            --base performance-results/base-2.json \
            --base performance-results/base-3.json \
            --candidate performance-results/candidate-1.json \
            --candidate performance-results/candidate-2.json \
            --candidate performance-results/candidate-3.json
          compare_status=$?
          if [[ -f performance-results/summary.md ]]; then
            cat performance-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$compare_status"

      - name: Upload raw reports, logs, and comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-regression-results
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30
